kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 8000
name = "billy som na caixa"
paths = ["/"]

[services.development]
# Em dev o bot já roda via workflow "billy som na caixa". Este watchdog aguarda
# ele estar saudável e mantém o serviço marcado como ativo sem conflito de porta.
run = "bash -c 'until curl -sf http://localhost:8000/healthz >/dev/null 2>&1; do sleep 3; done; while curl -sf http://localhost:8000/healthz >/dev/null 2>&1; do sleep 15; done'"

[services.production]

[services.production.run]
args = ["bash", "-c", "cd /home/runner/workspace/myjamrobot && python -m app.bootstrap"]

[services.production.run.env]
PORT = "8000"

[services.production.health.startup]
path = "/healthz"
